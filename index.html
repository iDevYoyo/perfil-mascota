<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Mascota</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 320px;
            width: 90%;
            display: none; /* Se oculta hasta cargar los datos */
        }
        .foto-mascota {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #FF6B6B;
            margin-bottom: 15px;
        }
        h1 { margin: 0 0 5px; color: #333; font-size: 24px; }
        h2 { margin: 0 0 15px; color: #FF6B6B; font-size: 16px; font-weight: normal; }
        p { color: #666; line-height: 1.5; margin-bottom: 25px; font-size: 15px; }
        .datos {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: left;
            font-size: 14px;
        }
        .btn {
            background: #FF6B6B;
            color: white;
            text-decoration: none;
            padding: 15px;
            border-radius: 30px;
            display: block;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.3s;
        }
        .btn:active { background: #e55a5a; }
        #error-msg {
            color: #333;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

    <h2 id="error-msg">Mascota no encontrada o ID inválido.</h2>

    <div class="card" id="perfil-card">
        <img src="" alt="Foto de la mascota" class="foto-mascota" id="mascota-foto">
        
        <h1 id="mascota-nombre"></h1>
        <h2 id="mascota-mensaje"></h2>
        
        <div class="datos">
            <strong>Dueño:</strong> <span id="mascota-dueno"></span><br>
            <strong>Teléfono:</strong> <span id="mascota-tel-text"></span><br>
            <strong>Ciudad:</strong> <span id="mascota-ciudad"></span><br>
            <strong>Nota:</strong> <span id="mascota-nota"></span>
        </div>

        <a href="#" class="btn" id="mascota-tel-link">Llamar a mi dueño</a>
    </div>

    <script>
        
        const urlParams = new URLSearchParams(window.location.search);
        const mascotaId = urlParams.get('id');

        if (!mascotaId) {
            document.getElementById('error-msg').style.display = 'block';
        } else {
       
            fetch('datos.json')
                .then(response => response.json())
                .then(data => {
                    if (data[mascotaId]) {
                        const mascota = data[mascotaId];
                        
                      
                        document.getElementById('mascota-foto').src = mascota.foto;
                        document.getElementById('mascota-nombre').innerText = mascota.nombre;
                        document.getElementById('mascota-mensaje').innerText = mascota.mensaje;
                        document.getElementById('mascota-dueno').innerText = mascota.dueno;
                        document.getElementById('mascota-tel-text').innerText = mascota.telefono;
                        document.getElementById('mascota-ciudad').innerText = mascota.ciudad;
                        document.getElementById('mascota-nota').innerText = mascota.nota;
                        document.getElementById('mascota-tel-link').href = `tel:${mascota.telefono.replace(/\s+/g, '')}`;
                        
                      
                        document.getElementById('perfil-card').style.display = 'block';
                    } else {
                        document.getElementById('error-msg').style.display = 'block';
                    }
                })
                .catch(error => {
                    console.error('Error al cargar la base de datos:', error);
                    document.getElementById('error-msg').style.display = 'block';
                });
        }
    </script>
</body>
</html>
