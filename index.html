<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Mascota</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 320px;
            width: 90%;
        }
        .foto-mascota {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #FF6B6B;
            margin-bottom: 15px;
        }
        h1 { margin: 0 0 5px; color: #333; font-size: 24px; }
        h2 { margin: 0 0 15px; color: #FF6B6B; font-size: 16px; font-weight: normal; }
        p { color: #666; line-height: 1.5; margin-bottom: 25px; font-size: 15px; }
        .datos {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: left;
            font-size: 14px;
        }
        .btn {
            background: #FF6B6B;
            color: white;
            text-decoration: none;
            padding: 15px;
            border-radius: 30px;
            display: block;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.3s;
        }
        .btn:active { background: #e55a5a; }
    </style>
</head>
<body>

    <div class="card">
        <!-- cambio de imagen aqui bro -->
        <img src="https://via.placeholder.com/150" alt="Foto de la mascota" class="foto-mascota">
        <!-- nombre del perrito -->
        <h1>¡Hola! Soy Cuco2 🐾</h1>
        <h2>Por favor, ayúdame a volver a casa.</h2>
        
        <div class="datos">
            <strong>Dueño:</strong> Pedro<br>
            <strong>Teléfono:</strong> +56 9 XXXX XXXX<br>
            <strong>Ciudad:</strong> Curicó<br>
            <strong>Nota:</strong> Soy amigable pero estoy asustado.
        </div>

        <!-- numero del cliente -->
        <a href="tel:+56900000000" class="btn">Llamar a mi dueño</a>
    </div>

</body>
</html>
